name: Android Touch + Resume Verify

on:
  push:
    branches:
      - android-port
  workflow_dispatch:

jobs:
  verify-android-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize required submodules
        run: |
          git submodule sync --recursive
          git submodule update --init deps/TGUI deps/Catch2 deps/cppcodec deps/fmtlib

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Select emulator ABI
        shell: bash
        run: |
          sed -i 's/abiFilters "arm64-v8a"/abiFilters "x86_64"/' android/app/build.gradle
          grep -n 'abiFilters' android/app/build.gradle

      - name: Bundle x86_64 OpenAL runtime
        shell: bash
        run: |
          mkdir -p android/app/src/main/jniLibs/x86_64
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/SFML/SFML/2.6.2/extlibs/libs-android/x86_64/libopenal.so \
            --output android/app/src/main/jniLibs/x86_64/libopenal.so
          test -s android/app/src/main/jniLibs/x86_64/libopenal.so

      - name: Bundle game resources
        shell: bash
        run: |
          rm -rf android/app/src/main/assets/data
          mkdir -p \
            android/app/src/main/assets/data/cursors \
            android/app/src/main/assets/data/dialogs \
            android/app/src/main/assets/data/fonts \
            android/app/src/main/assets/data/graphics \
            android/app/src/main/assets/data/sounds \
            android/app/src/main/assets/data/strings \
            android/app/src/main/assets/data/shaders
          cp rsrc/cursors/*.gif android/app/src/main/assets/data/cursors/
          cp rsrc/dialogs/*.xml android/app/src/main/assets/data/dialogs/
          cp rsrc/fonts/*.ttf android/app/src/main/assets/data/fonts/
          find rsrc/fonts -maxdepth 1 -type f -name '*.bdf' -exec cp {} android/app/src/main/assets/data/fonts/ \;
          cp rsrc/graphics/*.png android/app/src/main/assets/data/graphics/
          cp rsrc/sounds/*.wav android/app/src/main/assets/data/sounds/
          cp rsrc/strings/*.txt android/app/src/main/assets/data/strings/
          cp src/gfx/mask.frag src/gfx/mask.vert android/app/src/main/assets/data/shaders/
          (cd android/app/src/main/assets && find data -type f ! -name 'assets-manifest.txt' -print | sort > data/assets-manifest.txt)
          test -s android/app/src/main/assets/data/assets-manifest.txt

      - name: Build emulator APK
        shell: bash
        run: gradle -p android :app:assembleDebug --stacktrace --no-daemon

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify real title, touch, dialog, and Home resume
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: Nexus 6
          disable-animations: true
          script: bash .github/scripts/android_verify_runtime.sh

      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-touch-resume-verification
          path: |
            verify-pid-before.txt
            verify-pid-after.txt
            verify-dialog-resume-pid.txt
            tutorial-center.txt
            verify-title.log
            verify-after-resume.log
            verify-after-tap.log
            verify-dialog-after-resume.log
            verify-before.raw
            verify-after.raw
            verify-dialog.raw
            verify-dialog-after-resume.raw
            verify-failure-logcat.txt
            verify-exit-info.txt
            verify-activities.txt
            verify-ps.txt
            verify-failure.raw
          if-no-files-found: warn
          retention-days: 7
