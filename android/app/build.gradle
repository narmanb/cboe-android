plugins {
    id "com.android.application"
}

android {
    namespace "org.openboe.cboe.android"
    compileSdk 35
    ndkVersion "25.2.9519653"

    defaultConfig {
        applicationId "org.openboe.cboe.android"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "0.1.0"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared", "-DCMAKE_PROJECT_INCLUDE=${projectDir}/src/main/cpp/android_source_patches.cmake"
                cppFlags "-std=c++17", "-fexceptions", "-frtti"
                targets "cboe", "sfml-activity"
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}