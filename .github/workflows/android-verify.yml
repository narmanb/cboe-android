name: Android Touch + Resume Verify

on:
  push:
    branches:
      - android-port
  workflow_dispatch:

jobs:
  verify-android-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize required submodules
        run: |
          git submodule sync --recursive
          git submodule update --init deps/TGUI deps/Catch2 deps/cppcodec deps/fmtlib

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Select emulator ABI
        shell: bash
        run: |
          sed -i 's/abiFilters "arm64-v8a"/abiFilters "x86_64"/' android/app/build.gradle
          grep -n 'abiFilters' android/app/build.gradle

      - name: Bundle x86_64 OpenAL runtime
        shell: bash
        run: |
          mkdir -p android/app/src/main/jniLibs/x86_64
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/SFML/SFML/2.6.2/extlibs/libs-android/x86_64/libopenal.so \
            --output android/app/src/main/jniLibs/x86_64/libopenal.so
          test -s android/app/src/main/jniLibs/x86_64/libopenal.so

      - name: Bundle game resources
        shell: bash
        run: |
          rm -rf android/app/src/main/assets/data
          mkdir -p \
            android/app/src/main/assets/data/cursors \
            android/app/src/main/assets/data/dialogs \
            android/app/src/main/assets/data/fonts \
            android/app/src/main/assets/data/graphics \
            android/app/src/main/assets/data/sounds \
            android/app/src/main/assets/data/strings \
            android/app/src/main/assets/data/shaders
          cp rsrc/cursors/*.gif android/app/src/main/assets/data/cursors/
          cp rsrc/dialogs/*.xml android/app/src/main/assets/data/dialogs/
          cp rsrc/fonts/*.ttf android/app/src/main/assets/data/fonts/
          find rsrc/fonts -maxdepth 1 -type f -name '*.bdf' -exec cp {} android/app/src/main/assets/data/fonts/ \;
          cp rsrc/graphics/*.png android/app/src/main/assets/data/graphics/
          cp rsrc/sounds/*.wav android/app/src/main/assets/data/sounds/
          cp rsrc/strings/*.txt android/app/src/main/assets/data/strings/
          cp src/gfx/mask.frag src/gfx/mask.vert android/app/src/main/assets/data/shaders/
          (cd android/app/src/main/assets && find data -type f ! -name 'assets-manifest.txt' -print | sort > data/assets-manifest.txt)
          test -s android/app/src/main/assets/data/assets-manifest.txt

      - name: Build emulator APK
        shell: bash
        run: gradle -p android :app:assembleDebug --stacktrace --no-daemon

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify real title, touch, dialog, and Home resume
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: Nexus 6
          disable-animations: true
          script: |
            set -e
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n org.openboe.cboe.android/android.app.NativeActivity

            # Do not accept the Android splash screen as a successful launch.
            # TUTORIAL_CENTER is emitted by OpenBoE's real draw_startup().
            title_ready=0
            for i in $(seq 1 35); do
              if adb shell pidof org.openboe.cboe.android >/dev/null 2>&1; then
                adb logcat -d -v threadtime > verify-title.log
                if grep -q 'TUTORIAL_CENTER' verify-title.log; then
                  title_ready=1
                  break
                fi
              fi
              sleep 1
            done
            test "$title_ready" = "1"
            adb shell pidof org.openboe.cboe.android > verify-pid-before.txt
            test -s verify-pid-before.txt
            grep 'TUTORIAL_CENTER' verify-title.log | tail -n 5
            adb exec-out screencap > verify-before.raw

            # First prove the real title screen survives Home/resume in the same process.
            adb shell input keyevent KEYCODE_HOME
            sleep 1
            adb shell am start -W -n org.openboe.cboe.android/android.app.NativeActivity
            sleep 3
            adb shell pidof org.openboe.cboe.android > verify-pid-after.txt
            test -s verify-pid-after.txt
            test "$(cat verify-pid-before.txt)" = "$(cat verify-pid-after.txt)"
            adb logcat -d -v threadtime > verify-after-resume.log
            adb exec-out screencap > verify-after.raw
            python3 .github/scripts/verify_android_resume.py verify-before.raw verify-after.raw

            # Tap Tutorial only after the real title is confirmed. A button-click
            # marker alone is insufficient: require entry into cDialog::run too.
            python3 -c "import re; t=open('verify-after-resume.log',errors='replace').read(); m=re.findall(r'TUTORIAL_CENTER\\s+(-?\\d+)\\s+(-?\\d+)',t); assert m, 'TUTORIAL_CENTER missing'; print(*m[-1])" > tutorial-center.txt
            test -s tutorial-center.txt
            echo "Tapping Tutorial at $(cat tutorial-center.txt)"
            adb shell input tap $(cat tutorial-center.txt)

            dialog_ready=0
            for i in $(seq 1 12); do
              adb logcat -d -v threadtime > verify-after-tap.log
              if grep -q 'STARTUP_BUTTON_CLICK' verify-after-tap.log && grep -q 'DIALOG_OPEN' verify-after-tap.log; then
                dialog_ready=1
                break
              fi
              sleep 1
            done
            test "$dialog_ready" = "1"
            test "$(adb shell pidof org.openboe.cboe.android)" = "$(cat verify-pid-before.txt)"
            grep 'STARTUP_BUTTON_CLICK\|DIALOG_OPEN' verify-after-tap.log | tail -n 10
            adb exec-out screencap > verify-dialog.raw
            python3 .github/scripts/verify_android_changed.py verify-after.raw verify-dialog.raw

            # Finally background/resume while the inline modal itself is open.
            adb shell input keyevent KEYCODE_HOME
            sleep 1
            adb shell am start -W -n org.openboe.cboe.android/android.app.NativeActivity
            sleep 3
            adb shell pidof org.openboe.cboe.android > verify-dialog-resume-pid.txt
            test -s verify-dialog-resume-pid.txt
            test "$(cat verify-pid-before.txt)" = "$(cat verify-dialog-resume-pid.txt)"
            adb logcat -d -v threadtime > verify-dialog-after-resume.log
            adb exec-out screencap > verify-dialog-after-resume.raw
            python3 .github/scripts/verify_android_resume.py verify-dialog.raw verify-dialog-after-resume.raw

            # The build must not enter the post-resume context-activation failure loop seen in #51.
            if grep -q "Failed to activate the window's context" verify-dialog-after-resume.log; then
              echo "SFML context activation failure detected"
              grep "Failed to activate the window's context" verify-dialog-after-resume.log | tail -n 20
              exit 1
            fi

      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-touch-resume-verification
          path: |
            verify-pid-before.txt
            verify-pid-after.txt
            verify-dialog-resume-pid.txt
            tutorial-center.txt
            verify-title.log
            verify-after-resume.log
            verify-after-tap.log
            verify-dialog-after-resume.log
            verify-before.raw
            verify-after.raw
            verify-dialog.raw
            verify-dialog-after-resume.raw
          if-no-files-found: warn
