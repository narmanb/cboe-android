name: One-shot SFML GLES readback patch

on:
  push:
    branches:
      - android-port

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out android-port
        uses: actions/checkout@v4
        with:
          ref: android-port

      - name: Initialize SFML GLES extension pointers before texture readback
        shell: python
        run: |
          from pathlib import Path

          path = Path("android/app/src/main/cpp/CMakeLists.txt")
          text = path.read_text()
          marker = '    file(WRITE "${SFML_FONT_CPP}" "${SFML_FONT_SOURCE}")\n\n    # Android touchscreen input should behave like the desktop left mouse.\n'
          cmake = (
              '    file(WRITE "${SFML_FONT_CPP}" "${SFML_FONT_SOURCE}")\n\n'
              '    # SFML 2.6.2 GLES Texture::copyToImage uses framebuffer extension entry points\n'
              '    # before ensuring SFML has initialized those pointers. Font atlas growth reaches\n'
              '    # this readback path, so initialize extensions before the first FBO call.\n'
              '    set(SFML_TEXTURE_CPP "${sfml_SOURCE_DIR}/src/SFML/Graphics/Texture.cpp")\n'
              '    file(READ "${SFML_TEXTURE_CPP}" SFML_TEXTURE_SOURCE)\n'
              '    set(SFML_GLES_READBACK_OLD [=[#ifdef SFML_OPENGL_ES\n\n    // OpenGL ES doesn\'t have the glGetTexImage function]=])\n'
              '    set(SFML_GLES_READBACK_NEW [=[#ifdef SFML_OPENGL_ES\n\n    priv::ensureExtensionsInit();\n\n    // OpenGL ES doesn\'t have the glGetTexImage function]=])\n'
              '    string(FIND "${SFML_TEXTURE_SOURCE}" "${SFML_GLES_READBACK_OLD}" SFML_GLES_READBACK_POS)\n'
              '    if(SFML_GLES_READBACK_POS EQUAL -1)\n'
              '        message(FATAL_ERROR "Expected SFML 2.6.2 GLES Texture::copyToImage block was not found")\n'
              '    endif()\n'
              '    string(REPLACE "${SFML_GLES_READBACK_OLD}" "${SFML_GLES_READBACK_NEW}" SFML_TEXTURE_SOURCE "${SFML_TEXTURE_SOURCE}")\n'
              '    file(WRITE "${SFML_TEXTURE_CPP}" "${SFML_TEXTURE_SOURCE}")\n\n'
              '    # Android touchscreen input should behave like the desktop left mouse.\n'
          )
          if marker not in text:
              raise SystemExit("Expected SFML texture patch insertion point was not found")
          path.write_text(text.replace(marker, cmake, 1))
          Path(".github/workflows/patch-sfml-texture-readback.yml").unlink()

      - name: Commit permanent GLES readback fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/cpp/CMakeLists.txt .github/workflows/patch-sfml-texture-readback.yml
          git commit -m "Initialize SFML GLES extensions before texture readback"
          git push origin HEAD:android-port
