name: Inspect Codeberg upstream

on:
  push:
    branches:
      - codeberg-import-runner

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Clone and inspect Codeberg history
        run: |
          set -euo pipefail
          git clone https://codeberg.org/OpenBoE/oboe.git upstream
          cd upstream
          BASE=89307b7acade066d5aba1607dda86a7e6281db96
          echo "HEAD=$(git rev-parse HEAD)"
          echo "TREE=$(git rev-parse HEAD^{tree})"
          if git merge-base --is-ancestor "$BASE" HEAD; then
            echo "BASE_IS_ANCESTOR=yes"
            echo "COMMITS_SINCE_SHARED_BASE=$(git rev-list --count ${BASE}..HEAD)"
            echo "--- LOG SINCE SHARED BASE ---"
            git log --date=short --pretty=format:'%h %ad %s' ${BASE}..HEAD
            echo
            echo "--- SHORTSTAT SINCE SHARED BASE ---"
            git diff --shortstat ${BASE}..HEAD
          else
            echo "BASE_IS_ANCESTOR=no"
          fi
