name: One-shot max_dim source migration

on:
  push:
    branches: [android-port]
    paths:
      - '.github/scripts/one_shot_maxdim_migrate.py'
      - '.github/workflows/one-shot-maxdim-migrate.yml'

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout android-port
        uses: actions/checkout@v4
        with:
          ref: android-port
          fetch-depth: 0

      - name: Apply mechanical max_dim migration
        run: python3 .github/scripts/one_shot_maxdim_migrate.py

      - name: Commit migrated source and remove one-shot helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/one_shot_maxdim_migrate.py .github/workflows/one-shot-maxdim-migrate.yml
          git add src
          git diff --cached --check
          git status --short
          git commit -m "Port Codeberg max_dim area API"
          git push origin HEAD:android-port
