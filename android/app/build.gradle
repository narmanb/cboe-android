plugins {
    id "com.android.application"
}

// Development APKs use Android's public AOSP test signing identity so every CI
// build has the same certificate without storing a private release key in this
// public repository. This is intentionally development-only; a public release
// should use its own private signing key.
def stableDebugSigningFile = file("$buildDir/stable-signing/openboe-aosp-test.p12")
// Android only requires versionCode to increase across updates. Epoch minutes
// stay well within Android's versionCode range while increasing automatically
// for future test builds.
def buildVersionCode = (System.currentTimeMillis() / 60000L).toInteger()

android {
    namespace "org.openboe.cboe.android"
    compileSdk 35
    ndkVersion "25.2.9519653"

    signingConfigs {
        stableDebug {
            storeFile stableDebugSigningFile
            storePassword "openboe-dev"
            keyAlias "openboe-dev"
            keyPassword "openboe-dev"
            storeType "PKCS12"
        }
    }

    defaultConfig {
        applicationId "org.openboe.cboe.android"
        minSdk 21
        targetSdk 35
        versionCode buildVersionCode
        versionName "0.1.0-dev"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared", "-DCMAKE_PROJECT_INCLUDE=${projectDir}/src/main/cpp/android_project_include_v2.cmake"
                cppFlags "-std=c++17", "-fexceptions", "-frtti"
                targets "cboe", "sfml-activity"
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            signingConfig signingConfigs.stableDebug
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

// Recreate a PKCS#12 keystore from the fixed AOSP test key before Gradle's
// signing validation runs. The AOSP test key is public by design and is suitable
// only for these sideloaded development builds.
tasks.register("prepareStableDebugSigning") {
    outputs.file(stableDebugSigningFile)
    doLast {
        if (stableDebugSigningFile.isFile()) {
            return
        }

        def signingDir = stableDebugSigningFile.parentFile
        signingDir.mkdirs()
        def pk8File = new File(signingDir, "testkey.pk8")
        def certFile = new File(signingDir, "testkey.x509.pem")
        def pemKeyFile = new File(signingDir, "testkey.pem")

        ant.get(
            src: "https://raw.githubusercontent.com/aosp-mirror/platform_build/master/target/product/security/testkey.pk8",
            dest: pk8File.absolutePath
        )
        ant.get(
            src: "https://raw.githubusercontent.com/aosp-mirror/platform_build/master/target/product/security/testkey.x509.pem",
            dest: certFile.absolutePath
        )

        project.exec {
            commandLine "openssl", "pkcs8", "-inform", "DER", "-nocrypt",
                "-in", pk8File.absolutePath, "-out", pemKeyFile.absolutePath
        }
        project.exec {
            commandLine "openssl", "pkcs12", "-export",
                "-in", certFile.absolutePath,
                "-inkey", pemKeyFile.absolutePath,
                "-out", stableDebugSigningFile.absolutePath,
                "-name", "openboe-dev",
                "-passout", "pass:openboe-dev"
        }

        if (!stableDebugSigningFile.isFile() || stableDebugSigningFile.length() == 0) {
            throw new GradleException("Failed to create stable Android development signing store")
        }
    }
}

tasks.configureEach { task ->
    if (task.name == "validateSigningDebug") {
        task.dependsOn("prepareStableDebugSigning")
    }
}

// The desktop build packages the four bundled scenarios as .boes files, which
// are gzip-compressed tar archives rooted at a directory named "scenario".
// Android's normal resource-staging step only copies the raw data files, so
// reproduce that packaging here immediately before every APK build. Keeping it
// in Gradle makes both ARM64 and emulator workflows use exactly the same stock
// scenario payload without duplicating shell logic.
def stockScenarioNames = ["busywork", "stealth", "valleydy", "zakhazi"]
def cboeRoot = file("${projectDir}/../..")

tasks.register("bundleStockScenarios") {
    doLast {
        def assetsRoot = file("src/main/assets")
        def dataRoot = new File(assetsRoot, "data")
        if (!dataRoot.isDirectory()) {
            throw new GradleException("Android game assets must be staged before bundling stock scenarios")
        }

        def outputDir = new File(dataRoot, "stock-scenarios")
        outputDir.mkdirs()

        def stockManifestEntries = []
        stockScenarioNames.each { scenarioName ->
            def sourceDir = new File(cboeRoot, "rsrc/scenarios/${scenarioName}")
            if (!new File(sourceDir, "header.exs").isFile()) {
                throw new GradleException("Missing stock scenario source: ${sourceDir}")
            }

            def archiveFile = new File(outputDir, "${scenarioName}.boes")
            ant.tar(destfile: archiveFile.absolutePath, compression: "gzip") {
                tarfileset(dir: sourceDir.absolutePath, prefix: "scenario", excludes: "**/.*")
            }
            if (!archiveFile.isFile() || archiveFile.length() == 0) {
                throw new GradleException("Failed to package stock scenario: ${scenarioName}")
            }

            stockManifestEntries << "data/stock-scenarios/${scenarioName}.boes"
        }

        // The workflow stages the normal game-resource manifest before Gradle
        // runs. Add the freshly-created scenario archives explicitly instead
        // of rescanning the directory through Gradle's FileTree, which can
        // retain a pre-task snapshot and omit files created during this task.
        def manifestFile = new File(dataRoot, "assets-manifest.txt")
        def manifestEntries = manifestFile.isFile()
            ? manifestFile.readLines("UTF-8").findAll { !it.trim().isEmpty() }
            : []
        manifestEntries.removeAll { it.startsWith("data/stock-scenarios/") }
        manifestEntries.addAll(stockManifestEntries)
        manifestEntries = manifestEntries.unique().sort()
        manifestFile.setText(manifestEntries.join("\n") + "\n", "UTF-8")

        stockManifestEntries.each { expected ->
            def archiveName = expected.substring(expected.lastIndexOf('/') + 1)
            if (!new File(outputDir, archiveName).isFile() || !manifestEntries.contains(expected)) {
                throw new GradleException("Stock scenario was not staged correctly: ${expected}")
            }
        }
    }
}

tasks.named("preBuild").configure {
    dependsOn("bundleStockScenarios")
}