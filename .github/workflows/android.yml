name: Android ARM64

on:
  push:
    branches:
      - android-port
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize required submodules
        run: |
          git submodule sync --recursive
          git submodule update --init deps/TGUI deps/Catch2 deps/cppcodec deps/fmtlib

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Bundle OpenAL runtime
        shell: bash
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/SFML/SFML/2.6.2/extlibs/libs-android/arm64-v8a/libopenal.so \
            --output android/app/src/main/jniLibs/arm64-v8a/libopenal.so
          test -s android/app/src/main/jniLibs/arm64-v8a/libopenal.so

      # Android assets are not ordinary filesystem paths. android_main.cpp
      # stages them into internalDataPath before OpenBoE starts. The explicit
      # manifest avoids relying on Android asset-directory enumeration.
      - name: Bundle game resources
        shell: bash
        run: |
          rm -rf android/app/src/main/assets/data
          mkdir -p \
            android/app/src/main/assets/data/cursors \
            android/app/src/main/assets/data/dialogs \
            android/app/src/main/assets/data/fonts \
            android/app/src/main/assets/data/graphics \
            android/app/src/main/assets/data/sounds \
            android/app/src/main/assets/data/strings \
            android/app/src/main/assets/data/shaders
          cp rsrc/cursors/*.gif android/app/src/main/assets/data/cursors/
          cp rsrc/dialogs/*.xml android/app/src/main/assets/data/dialogs/
          cp rsrc/fonts/*.ttf android/app/src/main/assets/data/fonts/
          find rsrc/fonts -maxdepth 1 -type f -name '*.bdf' -exec cp {} android/app/src/main/assets/data/fonts/ \;
          cp rsrc/graphics/*.png android/app/src/main/assets/data/graphics/
          cp rsrc/sounds/*.wav android/app/src/main/assets/data/sounds/
          cp rsrc/strings/*.txt android/app/src/main/assets/data/strings/
          cp src/gfx/mask.frag src/gfx/mask.vert android/app/src/main/assets/data/shaders/
          (cd android/app/src/main/assets && find data -type f ! -name 'assets-manifest.txt' -print | sort > data/assets-manifest.txt)
          test -s android/app/src/main/assets/data/assets-manifest.txt
          grep -qx 'data/fonts/bold.ttf' android/app/src/main/assets/data/assets-manifest.txt

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle -p android :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee android-build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android-build.log
          if-no-files-found: warn

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cboe-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # Build an x86_64 copy only inside CI and launch it in an Android emulator.
  # In addition to process survival, this test now verifies that Home/resume
  # leaves the visible title screen substantially unchanged and that a real
  # Android touchscreen tap reaches OpenBoE's startup-button handler.
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize required submodules
        run: |
          git submodule sync --recursive
          git submodule update --init deps/TGUI deps/Catch2 deps/cppcodec deps/fmtlib

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Select emulator ABI
        shell: bash
        run: |
          sed -i 's/abiFilters "arm64-v8a"/abiFilters "x86_64"/' android/app/build.gradle
          grep -n 'abiFilters' android/app/build.gradle

      - name: Bundle x86_64 OpenAL runtime
        shell: bash
        run: |
          mkdir -p android/app/src/main/jniLibs/x86_64
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/SFML/SFML/2.6.2/extlibs/libs-android/x86_64/libopenal.so \
            --output android/app/src/main/jniLibs/x86_64/libopenal.so
          test -s android/app/src/main/jniLibs/x86_64/libopenal.so

      - name: Bundle game resources
        shell: bash
        run: |
          rm -rf android/app/src/main/assets/data
          mkdir -p \
            android/app/src/main/assets/data/cursors \
            android/app/src/main/assets/data/dialogs \
            android/app/src/main/assets/data/fonts \
            android/app/src/main/assets/data/graphics \
            android/app/src/main/assets/data/sounds \
            android/app/src/main/assets/data/strings \
            android/app/src/main/assets/data/shaders
          cp rsrc/cursors/*.gif android/app/src/main/assets/data/cursors/
          cp rsrc/dialogs/*.xml android/app/src/main/assets/data/dialogs/
          cp rsrc/fonts/*.ttf android/app/src/main/assets/data/fonts/
          find rsrc/fonts -maxdepth 1 -type f -name '*.bdf' -exec cp {} android/app/src/main/assets/data/fonts/ \;
          cp rsrc/graphics/*.png android/app/src/main/assets/data/graphics/
          cp rsrc/sounds/*.wav android/app/src/main/assets/data/sounds/
          cp rsrc/strings/*.txt android/app/src/main/assets/data/strings/
          cp src/gfx/mask.frag src/gfx/mask.vert android/app/src/main/assets/data/shaders/
          (cd android/app/src/main/assets && find data -type f ! -name 'assets-manifest.txt' -print | sort > data/assets-manifest.txt)
          test -s android/app/src/main/assets/data/assets-manifest.txt
          grep -qx 'data/fonts/bold.ttf' android/app/src/main/assets/data/assets-manifest.txt

      - name: Build emulator APK
        shell: bash
        run: |
          set -o pipefail
          gradle -p android :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee android-emulator-build.log

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch, verify resume, and tap title button
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: Nexus 6
          disable-animations: true
          script: |
            set -e
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n org.openboe.cboe.android/android.app.NativeActivity || true
            sleep 8
            adb shell pidof org.openboe.cboe.android > runtime-pid.txt || true
            test -s runtime-pid.txt
            adb logcat -d -v threadtime > runtime-logcat.txt
            adb exec-out screencap -p > runtime-before-resume.png
            adb exec-out screencap > runtime-before-resume.raw

            echo "Process PID: $(cat runtime-pid.txt)"
            grep -E -i 'OpenBoEAndroid|OpenBoE|sfml-activity|AndroidRuntime|FATAL|DEBUG|SIG(SEGV|ABRT)|cboe|libc' runtime-logcat.txt | tail -n 300 || true

            adb shell input keyevent KEYCODE_HOME
            sleep 2
            adb shell am start -W -n org.openboe.cboe.android/android.app.NativeActivity || true
            sleep 5
            adb shell pidof org.openboe.cboe.android > runtime-resume-pid.txt || true
            test -s runtime-resume-pid.txt
            adb exec-out screencap -p > runtime-after-resume.png
            adb exec-out screencap > runtime-after-resume.raw
            adb logcat -d -v threadtime > runtime-resume-logcat.txt

            echo "Resume PID: $(cat runtime-resume-pid.txt)"
            grep -E -i 'OpenBoEAndroid|OpenBoE|sfml-activity|AndroidRuntime|FATAL|DEBUG|SIG(SEGV|ABRT)|cboe|libc|EGL' runtime-resume-logcat.txt | tail -n 300 || true

            # Compare raw RGBA screencaps using only Python's standard library.
            # A black resume screen or the old tiny Welcome dialog changes a
            # large portion of the screen even though the process remains alive.
            python3 - <<'PY'
            import struct

            def load(path):
                data = open(path, 'rb').read()
                if len(data) < 12:
                    raise SystemExit(f'{path}: screencap too short')
                w, h, _fmt = struct.unpack_from('<III', data, 0)
                n = w * h * 4
                if w <= 0 or h <= 0 or len(data) < n:
                    raise SystemExit(f'{path}: invalid screencap dimensions {w}x{h}')
                return w, h, data[-n:]

            w1, h1, a = load('runtime-before-resume.raw')
            w2, h2, b = load('runtime-after-resume.raw')
            if (w1, h1) != (w2, h2):
                raise SystemExit(f'resume screenshot dimensions changed: {w1}x{h1} -> {w2}x{h2}')

            pixels = w1 * h1
            changed = 0
            nonblack = 0
            for i in range(0, len(b), 4):
                br, bg, bb = b[i], b[i+1], b[i+2]
                if max(br, bg, bb) > 20:
                    nonblack += 1
                if max(abs(a[i]-br), abs(a[i+1]-bg), abs(a[i+2]-bb)) > 45:
                    changed += 1

            changed_ratio = changed / pixels
            nonblack_ratio = nonblack / pixels
            print(f'resume changed-pixel ratio: {changed_ratio:.4f}')
            print(f'resume nonblack ratio: {nonblack_ratio:.4f}')
            if nonblack_ratio < 0.08:
                raise SystemExit('resume screen is effectively black')
            if changed_ratio > 0.15:
                raise SystemExit('resume screen differs too much from the pre-background title screen')
            PY

            # The Android build logs the exact pixel center of Tutorial after
            # drawing the title screen. Tap that coordinate through adb, then
            # require the existing startup click handler to report the tap.
            CENTER=$(grep 'TUTORIAL_CENTER' runtime-resume-logcat.txt | tail -n 1 | sed -E 's/.*TUTORIAL_CENTER ([0-9-]+) ([0-9-]+).*/\1 \2/')
            test -n "$CENTER"
            set -- $CENTER
            echo "Tapping Tutorial at $1,$2"
            adb shell input tap "$1" "$2"
            sleep 2
            adb logcat -d -v threadtime > runtime-after-tap-logcat.txt
            grep 'STARTUP_BUTTON_CLICK' runtime-after-tap-logcat.txt

      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-runtime-diagnostics
          path: |
            runtime-logcat.txt
            runtime-pid.txt
            runtime-resume-pid.txt
            runtime-resume-logcat.txt
            runtime-after-tap-logcat.txt
            runtime-before-resume.png
            runtime-after-resume.png
            runtime-before-resume.raw
            runtime-after-resume.raw
            android-emulator-build.log
          if-no-files-found: warn
