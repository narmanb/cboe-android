name: Android ARM64

on:
  push:
    branches:
      - android-port
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize required submodules
        run: |
          git submodule sync --recursive
          git submodule update --init deps/TGUI deps/Catch2 deps/cppcodec deps/fmtlib

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Bundle OpenAL runtime
        shell: bash
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/SFML/SFML/2.6.2/extlibs/libs-android/arm64-v8a/libopenal.so \
            --output android/app/src/main/jniLibs/arm64-v8a/libopenal.so
          test -s android/app/src/main/jniLibs/arm64-v8a/libopenal.so

      - name: Bundle game resources
        shell: bash
        run: |
          rm -rf android/app/src/main/assets/data
          mkdir -p \
            android/app/src/main/assets/data/cursors \
            android/app/src/main/assets/data/dialogs \
            android/app/src/main/assets/data/fonts \
            android/app/src/main/assets/data/graphics \
            android/app/src/main/assets/data/sounds \
            android/app/src/main/assets/data/strings \
            android/app/src/main/assets/data/shaders
          cp rsrc/cursors/*.gif android/app/src/main/assets/data/cursors/
          cp rsrc/dialogs/*.xml android/app/src/main/assets/data/dialogs/
          cp rsrc/fonts/*.ttf android/app/src/main/assets/data/fonts/
          find rsrc/fonts -maxdepth 1 -type f -name '*.bdf' -exec cp {} android/app/src/main/assets/data/fonts/ \;
          cp rsrc/graphics/*.png android/app/src/main/assets/data/graphics/
          cp rsrc/sounds/*.wav android/app/src/main/assets/data/sounds/
          cp rsrc/strings/*.txt android/app/src/main/assets/data/strings/
          cp src/gfx/mask.frag src/gfx/mask.vert android/app/src/main/assets/data/shaders/
          (cd android/app/src/main/assets && find data -type f ! -name 'assets-manifest.txt' -print | sort > data/assets-manifest.txt)
          test -s android/app/src/main/assets/data/assets-manifest.txt
          grep -qx 'data/fonts/bold.ttf' android/app/src/main/assets/data/assets-manifest.txt

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle -p android :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee android-build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android-build.log
          if-no-files-found: warn

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cboe-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # Build an x86_64 copy inside CI and launch it in an Android emulator.
  # This verifies process survival, the visible Home/resume result, and a real
  # Android touchscreen tap reaching OpenBoE's startup-button handler.
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize required submodules
        run: |
          git submodule sync --recursive
          git submodule update --init deps/TGUI deps/Catch2 deps/cppcodec deps/fmtlib

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Select emulator ABI
        shell: bash
        run: |
          sed -i 's/abiFilters "arm64-v8a"/abiFilters "x86_64"/' android/app/build.gradle
          grep -n 'abiFilters' android/app/build.gradle

      - name: Bundle x86_64 OpenAL runtime
        shell: bash
        run: |
          mkdir -p android/app/src/main/jniLibs/x86_64
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/SFML/SFML/2.6.2/extlibs/libs-android/x86_64/libopenal.so \
            --output android/app/src/main/jniLibs/x86_64/libopenal.so
          test -s android/app/src/main/jniLibs/x86_64/libopenal.so

      - name: Bundle game resources
        shell: bash
        run: |
          rm -rf android/app/src/main/assets/data
          mkdir -p \
            android/app/src/main/assets/data/cursors \
            android/app/src/main/assets/data/dialogs \
            android/app/src/main/assets/data/fonts \
            android/app/src/main/assets/data/graphics \
            android/app/src/main/assets/data/sounds \
            android/app/src/main/assets/data/strings \
            android/app/src/main/assets/data/shaders
          cp rsrc/cursors/*.gif android/app/src/main/assets/data/cursors/
          cp rsrc/dialogs/*.xml android/app/src/main/assets/data/dialogs/
          cp rsrc/fonts/*.ttf android/app/src/main/assets/data/fonts/
          find rsrc/fonts -maxdepth 1 -type f -name '*.bdf' -exec cp {} android/app/src/main/assets/data/fonts/ \;
          cp rsrc/graphics/*.png android/app/src/main/assets/data/graphics/
          cp rsrc/sounds/*.wav android/app/src/main/assets/data/sounds/
          cp rsrc/strings/*.txt android/app/src/main/assets/data/strings/
          cp src/gfx/mask.frag src/gfx/mask.vert android/app/src/main/assets/data/shaders/
          (cd android/app/src/main/assets && find data -type f ! -name 'assets-manifest.txt' -print | sort > data/assets-manifest.txt)
          test -s android/app/src/main/assets/data/assets-manifest.txt
          grep -qx 'data/fonts/bold.ttf' android/app/src/main/assets/data/assets-manifest.txt

      - name: Build emulator APK
        shell: bash
        run: |
          set -o pipefail
          gradle -p android :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee android-emulator-build.log

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch, verify resume, and tap title button
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: Nexus 6
          disable-animations: true
          script: bash .github/scripts/android_runtime_smoke.sh

      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-runtime-diagnostics
          path: |
            runtime-logcat.txt
            runtime-pid.txt
            runtime-resume-pid.txt
            runtime-resume-logcat.txt
            runtime-after-tap-logcat.txt
            runtime-before-resume.png
            runtime-after-resume.png
            runtime-before-resume.raw
            runtime-after-resume.raw
            runtime-launch.txt
            runtime-resume-launch.txt
            android-emulator-build.log
          if-no-files-found: warn
