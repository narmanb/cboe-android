name: Patch Android touch and resume

on:
  push:
    branches:
      - android-port
    paths:
      - .github/workflows/patch-android-touch-resume.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: android-port
          fetch-depth: 0

      - name: Apply Android input and resume fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/game/boe.actions.cpp",
              "location where_curs = sf::Mouse::getPosition(mainPtr());",
              "location where_curs = get_pointer_position(mainPtr());",
          )

          replace_once(
              "src/game/boe.startup.cpp",
              "bool handle_startup_press(location the_point) {\n\tthe_point = mouse_window_coords();",
              "bool handle_startup_press(location the_point) {\n\tthe_point = mainPtr().mapPixelToCoords(the_point, mainView);",
          )

          replace_once(
              "src/game/boe.main.cpp",
              "\t\tcase sf::Event::GainedFocus:\n\t\t\tcheck_window_moved(mainPtr(), last_window_x, last_window_y, \"MainWindow\");",
              "\t\tcase sf::Event::GainedFocus:\n#ifdef __ANDROID__\n\t\t\tmainPtr().setActive(true);\n\t\t\tmainPtr().setView(mainView);\n#endif\n\t\t\tcheck_window_moved(mainPtr(), last_window_x, last_window_y, \"MainWindow\");",
          )
          PY

      - name: Commit source fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/boe.actions.cpp src/game/boe.startup.cpp src/game/boe.main.cpp
          git commit -m "Fix Android touch hit testing and resume surface"
          git push origin android-port
